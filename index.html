<script>
  // The page follows the system setting until the toggle is used. The icon
  // shows the mode a click switches to. Choosing the mode the system already
  // uses drops the saved choice, so the page follows the system again.
  {
    const root = document.documentElement;
    const toggle = document.querySelector(".theme-toggle");
    const prefersLight = matchMedia("(prefers-color-scheme: light)");
    const system = () => (prefersLight.matches ? "light" : "dark");
    const current = () => root.dataset.theme || system();
    const update = () => {
      const next = current() === "dark" ? "light" : "dark";
      toggle.dataset.next = next;
      toggle.setAttribute("aria-label", `Switch to ${next} mode`);
      toggle.title = `Switch to ${next} mode`;
    };
    toggle.addEventListener("click", () => {
      const next = current() === "dark" ? "light" : "dark";
      try {
        if (next === system()) { delete root.dataset.theme; localStorage.removeItem("theme"); }
        else { root.dataset.theme = next; localStorage.setItem("theme", next); }
      } catch { root.dataset.theme = next; }
      update();
    });
    prefersLight.addEventListener("change", update);
    toggle.hidden = false;
    update();
  }
</script>
