<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yilin Zhang</title>
<meta name="description" content="Yilin Zhang, ML engineer working on audio. Projects: Pocketeer, Decklet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0c0e'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23e8e8ea'/%3E%3C/svg%3E">
<style>
  /* dark, monospace, square; a narrow column held together by hairlines */
  :root {
    --bg: #0c0c0e; --ink: #e8e8ea; --body: #a9a9b0; --muted: #6c6c74; --rule: #2a2a30;
    --purple: #7f5ab6;
    --mono: "SF Mono", ui-monospace, Menlo, "JetBrains Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; border-radius: 0; }
  html { background: var(--bg); color: var(--ink); color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding-bottom: 14vh; box-sizing: border-box; font: 15px/1.7 var(--mono); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .sheet { width: min(640px, 100% - 48px); padding: 64px 0; }

  h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
  .bio { color: var(--body); margin: 0 0 20px; text-wrap: balance; }
  .links { display: flex; gap: 20px; margin-bottom: 56px; }
  .links a { color: var(--body); padding: 1px 4px; margin: 0 -4px; }
  .links a:hover { background: var(--ink); color: var(--bg); }

  /* one ruled row per project. On hover the project's colour sweeps in from the left. */
  .project:first-child { border-top: 1px solid var(--rule); }
  .project {
    position: relative; isolation: isolate; display: grid; grid-template-columns: 140px 1fr 20px; align-items: center; gap: 20px;
    padding: 18px 12px; margin: 0 -12px; border-bottom: 1px solid var(--rule);
  }
  .project::before {
    content: ""; position: absolute; inset: -1px 0; z-index: -1; background: var(--fill);
    transform: scaleX(0); transform-origin: left center; transition: transform .38s cubic-bezier(.2, .7, .1, 1);
  }
  .project:hover::before, .project:focus-visible::before { transform: scaleX(1); }
  .project .name { display: flex; align-items: center; gap: 12px; font-weight: 700; }
  .project .desc { color: var(--body); }
  .project .go { color: var(--muted); text-align: right; }
  .project .name, .project .desc, .project .go { transition: color .2s .08s, transform .38s cubic-bezier(.2, .7, .1, 1); }
  .project:hover .go { transform: translateX(4px); }
  .mark { width: 10px; height: 10px; flex: none; background: var(--fill); transition: background .2s .08s; }
  .pocketeer { --fill: var(--ink); --on: var(--bg); }
  .pocketeer .mark { transform: rotate(45deg) scale(.85); }
  .decklet { --fill: var(--purple); --on: #fff; }
  .project:hover .name, .project:hover .desc, .project:hover .go { color: var(--on); }
  .project:hover .mark { background: var(--on); }
  .project:focus-visible { outline: none; }

  @media (max-width: 560px) {
    .sheet { padding: 48px 0; }
    h1 { font-size: 26px; }
    .project { grid-template-columns: 1fr 20px; gap: 4px 16px; }
    .project .desc { grid-column: 1; grid-row: 2; }
    .project .go { grid-column: 2; grid-row: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .project::before, .project .name, .project .desc, .project .go, .mark { transition: none; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <h1>Yilin Zhang</h1>
    <p class="bio">ML engineer working on audio, building small tools on the side.</p>
    <nav class="links">
      <a href="https://github.com/yilin-zhang">github</a>
      <a href="https://www.linkedin.com/in/yilin-zhang-12a682190/">linkedin</a>
    </nav>
  </header>

  <main class="projects">
    <a class="project decklet" href="decklet/">
      <span class="name"><span class="mark" aria-hidden="true"></span>Decklet</span>
      <span class="desc">Spaced repetition for Emacs.</span>
      <span class="go" aria-hidden="true">→</span>
    </a>
    <a class="project pocketeer" href="pocketeer/">
      <span class="name"><span class="mark" aria-hidden="true"></span>Pocketeer</span>
      <span class="desc">An Analogue Pocket manager.</span>
      <span class="go" aria-hidden="true">→</span>
    </a>
  </main>

</div>
</body>
</html>
